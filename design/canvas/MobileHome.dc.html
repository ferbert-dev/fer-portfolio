<header style="display: flex; align-items: stretch; justify-content: space-between; border-bottom: 2px solid #15181C;">

<button type="button" aria-label="Open menu" style="width: 56px; border: 0; border-left: 1px solid #15181C; background: transparent; display: grid; place-items: center;"><svg width="22" height="22" fill="none" stroke="#15181C" stroke-width="1.8"><path d="M3 6h16M3 11h16M3 16h16"></path></svg></button>

<p style="margin: 0; color: #2E333A;">We find the work AI can do cheaper, measure it in hours, and build the agents that take it over.</p>

<figure aria-label="Invoice intake: 38 hours per week by hand, 3 hours per week with an agent" style="margin: 18px 16px 0; border: 2px solid #15181C; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); font-family: 'Barlow Semi Condensed', sans-serif; font-size: 14px; background-color: #F6F7F5; background-image: linear-gradient(#E6EAEC 1px, transparent 1px), linear-gradient(90deg, #E6EAEC 1px, transparent 1px); background-size: 24px 24px;">
<div class="wipe" style="padding: 10px; border-right: 1px solid #15181C; display: flex; flex-direction: column; gap: 6px;">
<div style="font-weight: 600;">View A, by hand</div>
<div style="display: flex; justify-content: space-between; border: 1.5px solid #15181C; padding: 4px 6px; background: #F6F7F5;"><span>Read invoice</span><span>7 h</span></div>
<div style="display: flex; justify-content: space-between; border: 1.5px solid #15181C; padding: 4px 6px; background: #F6F7F5;"><span>Type in</span><span>11 h</span></div>

<div style="display: flex; justify-content: space-between; border: 1.5px solid #15181C; padding: 4px 6px; background: #F6F7F5;"><span>Check VAT</span><span>6 h</span></div>
<div style="display: flex; justify-content: space-between; border: 1.5px solid #15181C; padding: 4px 6px; background: #F6F7F5;"><span>Book in ERP</span><span>5 h</span></div>
<div style="border-top: 1px solid #15181C; padding-top: 4px; font-weight: 700; font-size: 16px;">38 h / week</div>
</div>
<div class="wipe d2" style="padding: 10px; display: flex; flex-direction: column; gap: 6px; color: #C2321C;">
<div style="font-weight: 600;">View B, with AI</div>
<div style="flex: 1; display: grid; place-items: center; border: 1.5px solid #C2321C; background-color: #F6F7F5; background-image: repeating-linear-gradient(135deg, transparent 0 7px, rgba(194,50,28,0.28) 7px 8px); text-align: center;"><span style="background: #F6F7F5; padding: 2px 6px; font-weight: 700; font-size: 16px;">Agent<br><span style="font-weight: 500; font-size: 13px; color: #15181C;">0 h staff time</span></span></div>
<div style="display: flex; justify-content: space-between; border: 1.5px solid #15181C; padding: 4px 6px; background: #F6F7F5; color: #15181C;"><span>Review</span><span>2.5 h</span></div>
<div style="display: flex; justify-content: space-between; border: 1.5px solid #15181C; padding: 4px 6px; background: #F6F7F5; color: #15181C;"><span>ERP, auto</span><span>0.5 h</span></div>
<div style="border-top: 1px solid #C2321C; padding-top: 4px; font-weight: 700; font-size: 16px;">3 h / week</div>
</div>
</figure>
<p style="margin: 6px 16px 0; font-family: 'Barlow Semi Condensed', sans-serif; font-size: 12px; color: #4A5058;">Illustrative example.</p>

<a href="Contact.dc.html" class="btn-red" style="min-height: 48px; display: grid; place-items: center; font-family: 'Barlow Semi Condensed', sans-serif; font-size: 18px; font-weight: 600;">Map my process</a>
